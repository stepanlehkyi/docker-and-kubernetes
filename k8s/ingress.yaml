apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angular-dotnet-ingressroute
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik 
  rules:
  - host: angular-dotnet-web-app.com.ua
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: weather-api-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-frontend-service
            port:
              number: 80