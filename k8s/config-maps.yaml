apiVersion: v1
kind: ConfigMap
metadata:
  name: angular-app-config
data:
  API_BASE_URL: "api/"
  API_TIMEOUT: "30000"
  LOG_LEVEL: "info"
  MAX_RETRIES: "3"
  RETRY_DELAY_MS: "1000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dotnet-api-config
data:
  WeatherApi__MaxForecastDays: "5"
  WeatherApi__MinTemperatureC: "-20"
  WeatherApi__MaxTemperatureC: "0"
  WeatherApi__EnableCaching: "false"
  WeatherApi__CacheDurationSeconds: "300"
  WeatherApi__ApiVersion: "1.0"
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  ConnectionStrings__Redis: "redis-db:6379"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
