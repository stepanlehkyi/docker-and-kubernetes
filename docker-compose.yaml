services:
  python-web-app:
    build: .
    ports:
      - "${PYTHON_WEB_APP_PORT:-8080}:8080"
    env_file:
      - .env/.env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - redis-storage:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis-storage: